name: CI

on:
  push:
    branches: [main] # This event tracker will trigger if we push directly to main in git
  pull_request:
    branches: [main] # This event tracker will trigger if we have PR 
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:         # This is line tells the test to apply the following below before any run in this job
      run:
        working-directory: app #There it goes to the app directory so we don't need to mention the full path each time below
    steps:
      - uses: actions/checkout@v4  #Clones your repo onto that fresh VM. Without this step there'd be no files at all to test in VM
      - uses: actions/setup-python@v5  #Installs Python 3.12 on the runner
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt #pip will install the what is written in these files
      - run: pytest    #This is the actual test as everything above is just to setup the environment for this to run

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  build:
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3 # Set up the advanced workbench
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v5 # Actually Do the building and uploading
        with:
          context: .
          push: true # Send it to the cloud library
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
