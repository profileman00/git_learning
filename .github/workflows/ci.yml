name: CI

on:
  push:
    branches: [main] # This event tracker will trigger if we push directly to main in git
  pull_request:
    branches: [main] # This event tracker will trigger if we have PR 
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:         # This is line tells the test to apply the following below before any run in this job
      run:
        working-directory: app #There it goes to the app directory so we don't need to mention the full path each time below
    steps:
      - uses: actions/checkout@v4  #Clones your repo onto that fresh VM. Without this step there'd be no files at all to test in VM
      - uses: actions/setup-python@v5  #Installs Python 3.12 on the runner
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt #pip will install the what is written in these files
      - run: pytest    #This is the actual test as everything above is just to setup the environment for this to run

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: learning-app:${{ github.sha }}
          load: true
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: learning-app:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # set to '1' once you're ready to actually block on findings